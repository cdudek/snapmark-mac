# Weekly on Monday, one grouped PR per ecosystem (minor, patch and major together), a cooldown before
# new releases are proposed, and at most two open PRs. Security updates stay individual.
# The commit prefix keeps the PR title a Conventional Commit, which CI requires.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 5
      semver-major-days: 14
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
    groups:
      npm:
        patterns: ['*']
    ignore:
      # typescript-eslint supports TypeScript < 6.1; bump together by hand.
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # Types must match the Node version inside Electron (24 for Electron 44).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 5
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
    groups:
      github-actions:
        patterns: ['*']
