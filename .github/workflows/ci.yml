name: CI

# Runs once per ready (non-draft) pull request, never on push. Drafts cost nothing.
# Re-run it by hand after changing the PR title or the `major` label: those events do not trigger it.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # changed paths (gh pr diff)
  actions: read # non-blocking enforcement audit

env:
  SHARDS: '1'

# One runner, checkout and dependency install. Named steps identify the failing gate.
# Electron smoke needs a VM (sysctl / sandbox), so this job cannot use ubuntu-slim.
# Keep path filtering inside the job so the required `check` always reports.
jobs:
  check:
    name: check
    # Never skipped: a skipped required check counts as passed, so a draft would merge unchecked.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Drafts wait for ready
        if: github.event.pull_request.draft == true
        run: |
          echo "draft: CI runs once the PR is ready"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: f
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          # >>> changes-script (scripts/test_ci_changes.sh runs exactly these lines)
          set -eu
          set -f # keep the globs literal
          # The lists live in sdlc.json "ciPaths" (shell globs; * also crosses /). jq is on every runner.
          list() { jq -r "(.ciPaths$1 // []) | join(\" \")" sdlc.json; }
          # shellcheck disable=SC2254 # the unquoted pattern is the point: it is a glob from sdlc.json
          hit() { for g in $2; do case "$1" in $g) return 0 ;; esac; done; return 1; }
          STEPS="lint unit build e2e deploy"
          IGNORE=$(list .docs); ALL=$(list .all); CODE="$(list .code) $(list .config)"; SPECS=$(list .specs)
          for s in $STEPS; do
            eval "inc_$s=\"\$(list .$s.include)\" exc_$s=\"\$(list .$s.exclude)\""
            eval "$s=false"
          done
          everything() { for s in $STEPS; do eval "$s=true"; done; }
          full=false # the whole E2E suite, and every step once code or config changed
          if [ -z "$PR" ]; then
            full=true # push to the default branch
          else
            case "$BASE:$HEAD" in
              "$DEFAULT":*|project/*:*|*:milestone/*) full=true ;;
            esac
          fi
          specs=""
          touched=false # did the PR change any code or config at all?
          if [ -z "$PR" ]; then
            everything
            touched=true
          else
            files=$(gh pr diff "$PR" --name-only) # a failure (a diff too large to list) stops the job: fails closed
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              hit "$f" "$IGNORE" && continue
              if hit "$f" "$ALL"; then everything; touched=true; continue; fi
              hit "$f" "$CODE" || continue # neither code nor config: runs nothing
              touched=true
              known=false
              for s in $STEPS; do
                eval "inc=\"\$inc_$s\" exc=\"\$exc_$s\""
                # on a step when it matches the include and not the exclude
                if hit "$f" "$inc"; then known=true; hit "$f" "$exc" || eval "$s=true"; fi
              done
              # code or config that no step's include knows is a path you forgot to list: run everything
              $known || everything
              if hit "$f" "$SPECS"; then
                case "$f" in
                  *[!A-Za-z0-9._/-]*) echo "::warning::spec path skipped (unusual characters): $f" ;;
                  *) specs="$specs $f" ;;
                esac
              fi
            done <<< "$files"
            # safety net: where the full suite runs, any code or config change runs every step
            if [ "$touched" = true ] && [ "$full" = true ]; then everything; fi
          fi
          if [ "$e2e" != true ]; then
            matrix='[]'
          elif [ "$full" = true ]; then
            matrix=$(jq -nc --argjson n "$SHARDS" '[range(1; $n + 1) | {name: "\(.)/\($n)", shard: ., total: $n, files: ""}]')
          elif [ -n "$specs" ]; then
            matrix=$(jq -nc --arg s "${specs# }" '[{name: "touched specs", shard: 1, total: 1, files: $s}]')
          else
            matrix='[]' # e2e code changed but no spec did: lint and unit cover it; the full run is on the way to main
          fi
          {
            for s in lint unit build deploy; do eval "echo $s=\$$s"; done
            echo "full=$full"
            echo "matrix=$matrix"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Changed paths"
            echo
            echo "lint=$lint unit=$unit build=$build deploy=$deploy full=$full e2e=$([ "$matrix" = '[]' ] && echo none || echo run)"
            [ "$touched" = true ] || echo "No code or config changed: nothing runs except this job and \`check\`."
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          # <<< changes-script

      # The squash commit takes the PR title, and semantic-release reads it to choose the next version,
      # so the title must be a Conventional Commit: feat: → minor, fix: → patch, feat!: → major, docs:/chore:/ci: → none.
      - if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # A major version is the owner's call: "!" in the title or BREAKING CHANGE in the body (the squash commit's
      # message, as a "BREAKING CHANGE:" line) needs the "major" label, and only people with write access to the repo can add labels.
      - if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          MAJOR_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'major') }}
        run: |
          if { printf '%s' "$TITLE" | grep -qE '^[a-z]+(\([^)]*\))?!:'; } || { printf '%s' "$BODY" | grep -qE '^BREAKING[ -]CHANGE:'; }; then
            if [ "$MAJOR_LABEL" != true ]; then
              echo "::error::This PR would release a new major version. Only the owner decides that: remove the '!' / BREAKING CHANGE, or ask the owner to add the 'major' label."
              exit 1
            fi
            echo "Major release approved by the 'major' label."
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.f.outputs.lint == 'true' || steps.f.outputs.unit == 'true' || steps.f.outputs.matrix != '[]'
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies once
        if: steps.f.outputs.lint == 'true' || steps.f.outputs.unit == 'true' || steps.f.outputs.matrix != '[]'
        run: npm ci
      - name: Python gate tools
        if: steps.f.outputs.lint == 'true' || steps.f.outputs.unit == 'true' || github.event_name == 'pull_request'
        run: |
          python3 -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/pip" install -q lizard==1.25.1 pyyaml==6.0.3 check-jsonschema==0.39.0
          echo "$RUNNER_TEMP/v/bin" >> "$GITHUB_PATH"
      - name: Format
        if: steps.f.outputs.lint == 'true'
        run: npm run format:check
      - name: Lint
        if: steps.f.outputs.lint == 'true'
        run: npm run lint
      - name: Typecheck
        if: steps.f.outputs.lint == 'true'
        run: npm run typecheck

      - name: Slop gate
        if: steps.f.outputs.lint == 'true'
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          case "$BASE" in *0000000000000000000000000000000000000000) BASE="" ;; esac # first push: no previous commit
          python3 scripts/slop.py ${BASE:+--base "$BASE"} --summary "$RUNNER_TEMP/slop.md" || rc=$?
          cat "$RUNNER_TEMP/slop.md" >> "$GITHUB_STEP_SUMMARY"
          exit "${rc:-0}"

      - name: Boundaries and score
        if: steps.f.outputs.lint == 'true'
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          case "$BASE" in *0000000000000000000000000000000000000000) BASE="" ;; esac # first push: no previous commit
          { echo '```'; "$RUNNER_TEMP/v/bin/python" scripts/fitness.py arch ${BASE:+--base "$BASE"} || rc=$?; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${rc:-0}"

      - name: Build and bundle budgets
        if: steps.f.outputs.lint == 'true'
        run: npm run build
      - name: Bundle budgets
        if: steps.f.outputs.lint == 'true'
        run: |
          { echo '```'; "$RUNNER_TEMP/v/bin/python" scripts/fitness.py perf || rc=$?; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${rc:-0}"

      - name: Gate fixtures
        if: steps.f.outputs.lint == 'true' || steps.f.outputs.unit == 'true'
        run: python3 scripts/gates_test.py

      - name: Enforcement audit
        if: github.event_name == 'pull_request' && steps.f.outputs.lint == 'true'
        continue-on-error: true
        run: |
          python3 scripts/enforcement_audit.py --summary "$RUNNER_TEMP/audit.md" || rc=$?
          cat "$RUNNER_TEMP/audit.md" >> "$GITHUB_STEP_SUMMARY"
          exit "${rc:-0}"
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Unit tests
        if: steps.f.outputs.unit == 'true'
        run: npm test

      # Ubuntu 24.04 blocks the unprivileged user namespaces Electron's sandbox needs.
      - name: Enable Electron sandbox
        if: steps.f.outputs.matrix != '[]'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Electron smoke
        if: steps.f.outputs.matrix != '[]'
        run: xvfb-run -a npm run smoke
