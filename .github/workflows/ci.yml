name: CI

on:
  pull_request:
    # edited and labeled too, so retitling a PR or adding the major label re-runs the checks
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read # `gh pr diff` in the changes job

env:
  SHARDS: '1' # the smoke test is not sharded

# One job per check, so a PR shows exactly which one failed (owner, 2026-10-27).
# Ubuntu, not macOS: macOS minutes cost 10x on private repos. Releases build on macOS.
#
# If no code or config was touched, no check runs (owner, 2026-11-01). The `changes` job reads sdlc.json `ciPaths` and
# sets a flag per step: lint (format, lint, typecheck), unit, e2e (the smoke test). A README, docs, changes/ or
# screenshot PR costs `changes`, `pr-title` and `check`. Do not use workflow-level `paths-ignore`: a workflow that never
# starts leaves the required `check` pending and the PR unmergeable. Safety net: a push to main, and a PR into main
# or from milestone/* that changes any code or config, run every step. Reference: sdlc-run references/ci-blueprint.md.
jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lint: ${{ steps.f.outputs.lint }}
      unit: ${{ steps.f.outputs.unit }}
      build: ${{ steps.f.outputs.build }}
      deploy: ${{ steps.f.outputs.deploy }}
      full: ${{ steps.f.outputs.full }}
      matrix: ${{ steps.f.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: sdlc.json # only the path lists are needed
          sparse-checkout-cone-mode: false
      - id: f
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          # >>> changes-script (scripts/test_ci_changes.sh runs exactly these lines)
          set -eu
          set -f # keep the globs literal
          # The lists live in sdlc.json "ciPaths" (shell globs; * also crosses /). jq is on every runner.
          list() { jq -r "(.ciPaths$1 // []) | join(\" \")" sdlc.json; }
          # shellcheck disable=SC2254 # the unquoted pattern is the point: it is a glob from sdlc.json
          hit() { for g in $2; do case "$1" in $g) return 0 ;; esac; done; return 1; }
          STEPS="lint unit build e2e deploy"
          IGNORE=$(list .docs); ALL=$(list .all); CODE="$(list .code) $(list .config)"; SPECS=$(list .specs)
          for s in $STEPS; do
            eval "inc_$s=\"\$(list .$s.include)\" exc_$s=\"\$(list .$s.exclude)\""
            eval "$s=false"
          done
          everything() { for s in $STEPS; do eval "$s=true"; done; }
          full=false # the whole E2E suite, and every step once code or config changed
          if [ -z "$PR" ]; then
            full=true # push to the default branch
          else
            case "$BASE:$HEAD" in
              "$DEFAULT":*|project/*:*|*:milestone/*) full=true ;;
            esac
          fi
          specs=""
          touched=false # did the PR change any code or config at all?
          if [ -z "$PR" ]; then
            everything
            touched=true
          else
            files=$(gh pr diff "$PR" --name-only) # a failure (a diff too large to list) stops the job: fails closed
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              hit "$f" "$IGNORE" && continue
              if hit "$f" "$ALL"; then everything; touched=true; continue; fi
              hit "$f" "$CODE" || continue # neither code nor config: runs nothing
              touched=true
              known=false
              for s in $STEPS; do
                eval "inc=\"\$inc_$s\" exc=\"\$exc_$s\""
                # on a step when it matches the include and not the exclude
                if hit "$f" "$inc"; then known=true; hit "$f" "$exc" || eval "$s=true"; fi
              done
              # code or config that no step's include knows is a path you forgot to list: run everything
              $known || everything
              if hit "$f" "$SPECS"; then
                case "$f" in
                  *[!A-Za-z0-9._/-]*) echo "::warning::spec path skipped (unusual characters): $f" ;;
                  *) specs="$specs $f" ;;
                esac
              fi
            done <<< "$files"
            # safety net: where the full suite runs, any code or config change runs every step
            if [ "$touched" = true ] && [ "$full" = true ]; then everything; fi
          fi
          if [ "$e2e" != true ]; then
            matrix='[]'
          elif [ "$full" = true ]; then
            matrix=$(jq -nc --argjson n "$SHARDS" '[range(1; $n + 1) | {name: "\(.)/\($n)", shard: ., total: $n, files: ""}]')
          elif [ -n "$specs" ]; then
            matrix=$(jq -nc --arg s "${specs# }" '[{name: "touched specs", shard: 1, total: 1, files: $s}]')
          else
            matrix='[]' # e2e code changed but no spec did: lint and unit cover it; the full run is on the way to main
          fi
          {
            for s in lint unit build deploy; do eval "echo $s=\$$s"; done
            echo "full=$full"
            echo "matrix=$matrix"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Changed paths"
            echo
            echo "lint=$lint unit=$unit build=$build deploy=$deploy full=$full e2e=$([ "$matrix" = '[]' ] && echo none || echo run)"
            [ "$touched" = true ] || echo "No code or config changed: nothing runs except this job and \`check\`."
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          # <<< changes-script

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # The squash commit takes the PR title, and semantic-release reads it to choose the next version,
      # so the title must be a Conventional Commit: feat: → minor, fix: → patch, feat!: → major, docs:/chore:/ci: → none.
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # A major version is the owner's call: "!" in the title or BREAKING CHANGE in the body (the squash commit's
      # message, as a "BREAKING CHANGE:" line) needs the "major" label, and only people with write access to the repo can add labels.
      - env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          MAJOR_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'major') }}
        run: |
          if { printf '%s' "$TITLE" | grep -qE '^[a-z]+(\([^)]*\))?!:'; } || { printf '%s' "$BODY" | grep -qE '^BREAKING[ -]CHANGE:'; }; then
            if [ "$MAJOR_LABEL" != true ]; then
              echo "::error::This PR would release a new major version. Only the owner decides that: remove the '!' / BREAKING CHANGE, or ask the owner to add the 'major' label."
              exit 1
            fi
            echo "Major release approved by the 'major' label."
          fi

  format:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check

  lint:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # CQ-16, CI-24: anti-slop rules plus complexity and clone metrics against the merge base, its own job and part of `check`.
  # Cheap: ubuntu, no Electron download (scripts and the binary are skipped). Hotspots live in .fitness/slop-baseline.json.
  slop:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # the sticky delta comment; a failed comment never fails the job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the merge base
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Tools
        run: |
          python3 -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/pip" install -q lizard==1.25.1
          echo "$RUNNER_TEMP/v/bin" >> "$GITHUB_PATH"
      - name: Slop gate
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          case "$BASE" in *0000000000000000000000000000000000000000) BASE="" ;; esac # first push: no previous commit
          python3 scripts/slop.py ${BASE:+--base "$BASE"} --summary "$RUNNER_TEMP/slop.md" || rc=$?
          cat "$RUNNER_TEMP/slop.md" >> "$GITHUB_STEP_SUMMARY"
          exit "${rc:-0}"
      - name: Post the deltas on the PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --body-file "$RUNNER_TEMP/slop.md" --edit-last --create-if-none

  # STR-3, CI-23: architecture.yaml is the policy; imports are checked against it. Cycles hard-fail; the score may not drop below
  # 90 or the merge base's. Python and PyYAML only: no install, no build.
  arch:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the merge base
          persist-credentials: false
      - name: Tools
        run: |
          python3 -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/pip" install -q pyyaml==6.0.3
      - name: Boundaries and score
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          case "$BASE" in *0000000000000000000000000000000000000000) BASE="" ;; esac # first push: no previous commit
          { echo '```'; "$RUNNER_TEMP/v/bin/python" scripts/fitness.py arch ${BASE:+--base "$BASE"} || rc=$?; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${rc:-0}"

  # CI-23: the app bundle budget. Measures what electron-builder packs from dist/src (gzip), not the DMG: building and signing that
  # needs the macOS runner, which only the release does. perf.web is not applicable (no pages).
  perf:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run build
      - name: Tools
        run: |
          python3 -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/pip" install -q pyyaml==6.0.3
      - name: Bundle budgets
        run: |
          { echo '```'; "$RUNNER_TEMP/v/bin/python" scripts/fitness.py perf || rc=$?; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${rc:-0}"

  # TEST-19: every gate has bad-* and good-* fixtures in tests/fixtures/gates; a gate that stops failing its bad cases fails here.
  gates-test:
    needs: changes
    if: needs.changes.outputs.lint == 'true' || needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Tools
        run: |
          python3 -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/pip" install -q lizard==1.25.1 pyyaml==6.0.3
          echo "$RUNNER_TEMP/v/bin" >> "$GITHUB_PATH"
      - run: python3 scripts/gates_test.py

  # CI-30: a non-blocking report. Does every rule that names a check have the tool, the config, a job in `check`, and a green run?
  # The monthly enforcement-audit.yml runs the same script and opens an issue on gaps (CI-31).
  enforcement-audit:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      actions: read # the last run of each job on main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Tools
        run: |
          python3 -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/pip" install -q lizard==1.25.1 pyyaml==6.0.3
          echo "$RUNNER_TEMP/v/bin" >> "$GITHUB_PATH"
      - run: |
          python3 scripts/enforcement_audit.py --summary "$RUNNER_TEMP/audit.md" || rc=$?
          cat "$RUNNER_TEMP/audit.md" >> "$GITHUB_STEP_SUMMARY"
          exit "${rc:-0}"
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}

  unit:
    needs: changes
    if: needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    needs: changes
    if: needs.changes.outputs.matrix != '[]' # the smoke test: a full run only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Ubuntu 24.04 blocks the unprivileged user namespaces Electron's sandbox needs.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: xvfb-run -a npm run smoke

  # Decision4 v1.0.1 (https://github.com/Habitat-Thinking/decision4/blob/v1.0.1/DECISION4.md): the map is valid and the PR body meets the
  # floor of the paths the PR changes. Re-runs when the body is edited (see the pull_request types above).
  decision4:
    name: decision4
    # bot PRs cannot carry the fields
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tools
        run: |
          python3 -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/pip" install -q pyyaml==6.0.3 check-jsonschema==0.39.0
      - name: boundary-map.yaml matches the pinned schema
        # Decision4 v1.0.1, pinned by commit SHA (a tag can move)
        run: '"$RUNNER_TEMP/v/bin/check-jsonschema" --schemafile https://raw.githubusercontent.com/Habitat-Thinking/decision4/4429f821780655f253a954b2659bf38e7b9d5517/boundary-map.schema.json boundary-map.yaml'
      - name: PR body meets the floor of the changed paths
        env:
          BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/$GH_REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/files.txt"
          FILES="$RUNNER_TEMP/files.txt" "$RUNNER_TEMP/v/bin/python" - <<'PY'
          import os, re, sys, yaml
          ORDER = ["Undo", "Repair", "Migrate", "Answer"]
          body = re.sub(r"<!--.*?-->", "", os.environ["BODY"], flags=re.S).replace("\r", "")
          body = re.sub(r"<!--.*", "", body, flags=re.S)  # an unterminated comment hides the rest on GitHub
          def field(name):
              m = re.search(rf"^[ \t]*{name}:[ \t]*(.*?)[ \t]*$", body, re.M)
              return m.group(1) if m else ""
          def filled(name):
              return bool(field(name)) and not field(name).startswith("<")
          def fail(msg):
              print(f"::error::{msg}")
              sys.exit(1)
          def rx(glob):  # ** any depth, * one segment
              out, i = "", 0
              while i < len(glob):
                  if glob.startswith("**/", i): out, i = out + "(?:.*/)?", i + 3
                  elif glob.startswith("**", i): out, i = out + ".*", i + 2
                  elif glob[i] == "*": out, i = out + "[^/]*", i + 1
                  else: out, i = out + re.escape(glob[i]), i + 1
              return re.compile(out + "$")
          declared = field("Decision-Class")
          if declared not in ORDER:
              fail("PR body needs one line 'Decision-Class: Undo|Repair|Migrate|Answer' with exactly one class")
          files = [f for f in open(os.environ["FILES"]).read().split("\n") if f]
          floor = "Undo"
          for e in yaml.safe_load(open("boundary-map.yaml"))["entries"]:
              hit = sorted({f for g in e["select"].get("paths", []) for f in files if rx(g).match(f)})
              if hit:
                  print(f"floor {e['floor']}: {', '.join(hit[:5])}{' ...' if len(hit) > 5 else ''}")
                  floor = max(floor, e["floor"], key=ORDER.index)
          print(f"computed floor: {floor}, declared: {declared}")
          if ORDER.index(declared) < ORDER.index(floor) and not filled("Class-Change"):
              fail(f"Decision-Class {declared} is below the floor {floor}; raise it, or record the lowering in a 'Class-Change:' line")
          eff = max(declared, floor, key=ORDER.index)
          if ORDER.index(eff) >= 1 and not filled("Put-right"): fail(f"class {eff} needs a filled 'Put-right:' line")
          if ORDER.index(eff) >= 2 and not filled("Answerer"): fail(f"class {eff} needs a filled 'Answerer:' line")
          print(f"Decision4 class: {eff}")
          PY

  # The main ruleset requires a check named "check"; it passes only when no job above failed. A job skipped by `changes`
  # (no code or config touched) and pr-title on pushes to main count as passed.
  check:
    if: always()
    needs: [changes, pr-title, format, lint, typecheck, slop, arch, perf, gates-test, unit, e2e, decision4]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::A required job did not pass ($r)."; exit 1 ;; esac
          done
