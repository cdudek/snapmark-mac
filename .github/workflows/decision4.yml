name: Decision4

# Information only: the shared workflow reports the decision class on the PR and never blocks it.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: decision4-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  decision4:
    if: github.event.pull_request.draft == false
    uses: cdudek/blueprints/.github/workflows/decision4-check.yml@b5ebe31bc11a97cbd2fcdad7fc45a65fd1522c70 # information-only
